[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gchat-mcp"
version = "0.1.0"
description = "MCP server over a local SQLite copy of Google Chat, plus the downloader that fills it"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gchat-mcp = "gchat_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["live: talks to the real store or Google (run by hand)"]
addopts = "-m 'not live'"
